<app-menu class="fixed-top"></app-menu>
<div class="login-container">
  <div class="card login-card fade-in">

    <div class="login-header">
      <div class="login-icon">
        <i class="bi bi-person-fill"></i>
      </div>
      <h4 class="login-title">Bienvenido</h4>
      <p class="login-subtitle">Ingresa a tu cuenta para continuar</p>
    </div>

    <div class="login-body">

      <!-- Error Alert -->
      <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <div>{{ errorMessage }}</div>
      </div>

      <form (ngSubmit)="onLogin()">

        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="usernameInput" placeholder="Usuario" [(ngModel)]="username"
            name="username" required [disabled]="isLoading">
          <label for="usernameInput">Usuario</label>
        </div>

        <div class="form-floating mb-4">
          <input type="password" class="form-control" id="passwordInput" placeholder="Contraseña" [(ngModel)]="password"
            name="password" required [disabled]="isLoading">
          <label for="passwordInput">Contraseña</label>
        </div>

        <button class="btn btn-primary w-100 btn-login d-flex justify-content-center align-items-center" type="submit"
          [disabled]="isLoading">
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          <span *ngIf="!isLoading">Iniciar Sesión</span>
          <span *ngIf="isLoading">Cargando...</span>
        </button>

      </form>
    </div>

  </div>
</div>
