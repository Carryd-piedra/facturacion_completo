<div class="container my-5">

    <!-- HEADER SECTION -->
    <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h2 class="mb-1">Tipos de Documentos</h2>
            <p class="text-muted mb-0">Gestiona los documentos de identidad para tus clientes</p>
        </div>
        <button class="btn btn-primary-custom" (click)="toggleForm()" *ngIf="!mostrarFormulario">
            <i class="bi bi-plus-circle me-2"></i>
            Nuevo Tipo
        </button>
    </div>

    <div class="row g-4">

        <!-- LEFT COLUMN: FORM -->
        <div class="col-lg-4" *ngIf="mostrarFormulario">
            <div class="modern-card h-100">
                <div class="card-header-custom d-flex align-items-center gap-2">
                    <i class="bi" [ngClass]="editando ? 'bi-pencil-square' : 'bi-plus-circle'"></i>
                    {{ editando ? 'Editar Tipo' : 'Nuevo Tipo' }}
                </div>

                <div class="card-body p-4">
                    <form [formGroup]="form" (ngSubmit)="guardar()">
                        <input type="hidden" formControlName="tipoDocumentoId">

                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Nombre del Documento *</label>
                                <input class="form-control" formControlName="tipoDocumentoNombre"
                                    placeholder="Ej: RUC, Cédula">
                            </div>

                            <div class="col-12">
                                <label class="form-label">Código (SRI) *</label>
                                <select class="form-select" formControlName="tipoDocumentoCodigo">
                                    <option value="">Seleccione...</option>
                                    <option *ngFor="let s of codigosSri" [value]="s.codigo">
                                        {{ s.codigo }} - {{ s.nombre }}
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-4 d-grid gap-2">
                            <button class="btn btn-primary-custom justify-content-center w-100" type="submit">
                                <i class="bi" [ngClass]="editando ? 'bi-arrow-clockwise' : 'bi-save'"></i>
                                {{ editando ? 'Actualizar' : 'Guardar' }}
                            </button>

                            <button class="btn btn-outline-custom justify-content-center w-100" type="button"
                                (click)="cancelar()">
                                Cancelar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: LIST & SEARCH -->
        <div [ngClass]="mostrarFormulario ? 'col-lg-8' : 'col-12'">

            <!-- SEARCH BAR -->
            <div class="modern-card p-3 mb-4 d-flex align-items-center">
                <div class="flex-grow-1 search-container">
                    <i class="bi bi-search search-icon"></i>
                    <input type="text" class="form-control search-input" placeholder="Buscar por nombre o código..."
                        [(ngModel)]="filtro" (input)="aplicarFiltro()">
                </div>
            </div>

            <!-- TABLE -->
            <div class="modern-card">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th class="ps-4">Código</th>
                                <th>Nombre</th>
                                <th>Estado</th>
                                <th class="text-end pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let t of tiposFiltrados">
                                <td class="ps-4 fw-bold text-primary">{{ t.tipoDocumentoCodigo }}</td>
                                <td>{{ t.tipoDocumentoNombre }}</td>
                                <td>
                                    <span class="badge bg-success bg-opacity-10 text-success px-3 py-2 rounded-pill">
                                        Activo
                                    </span>
                                </td>
                                <td class="text-end pe-4">
                                    <div class="d-flex justify-content-end gap-2">
                                        <button class="btn-action btn-action-edit" (click)="editar(t)" title="Editar">
                                            <i class="bi bi-pencil-fill"></i>
                                        </button>
                                        <button class="btn-action btn-action-delete"
                                            (click)="eliminar(t.tipoDocumentoId)" title="Eliminar">
                                            <i class="bi bi-trash-fill"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <tr *ngIf="tiposFiltrados.length === 0">
                                <td colspan="4" class="text-center py-5 text-muted">
                                    <i class="bi bi-file-earmark-x display-1 d-block mb-3 opacity-25"></i>
                                    <h5 class="fw-normal">No se encontraron tipos de documentos</h5>
                                    <p class="small">Intenta con otro término de búsqueda</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

</div>
