<div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark mb-0">Reportes Generales</h2>
    </div>

    <div class="row">
        <div class="col-md-6 col-lg-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body text-center p-5">
                    <div class="mb-4 text-primary">
                        <i class="bi bi-file-earmark-text" style="font-size: 3rem;"></i>
                    </div>
                    <h5 class="card-title fw-bold mb-3">Reporte General HTML</h5>
                    <p class="card-text text-muted mb-4">
                        Visualiza un reporte completo de clientes, productos y facturas directamente en tu navegador.
                    </p>
                    <button class="btn btn-primary w-100" (click)="verReporte()">
                        <i class="bi bi-eye me-2"></i> Ver Reporte
                    </button>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-lg-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body text-center p-5">
                    <div class="mb-4 text-danger">
                        <i class="bi bi-file-earmark-pdf" style="font-size: 3rem;"></i>
                    </div>
                    <h5 class="card-title fw-bold mb-3">Descargar PDF</h5>
                    <p class="card-text text-muted mb-4">
                        Descarga el mismo reporte en formato PDF para imprimir o archivar.
                    </p>
                    <button class="btn btn-danger w-100" (click)="descargarPdf()">
                        <i class="bi bi-download me-2"></i> Descargar PDF
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
