<div class="container my-5">

  <h1 class="text-center mb-4 fw-bold text-danger">Contáctanos</h1>
  <p class="text-center text-muted mb-5">Estamos aquí para ayudarte. Envíanos un mensaje.</p>

  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

      <!-- Mensaje éxito -->
      <div *ngIf="enviado" class="alert alert-success">
        ¡Mensaje enviado correctamente!
      </div>

      <!-- Mensaje error -->
      <div *ngIf="error" class="alert alert-danger">
        {{ error }}
      </div>

      <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>

        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" formControlName="nombre"
            [class.is-invalid]="form.get('nombre')?.touched && form.get('nombre')?.invalid">
          <div class="invalid-feedback">
            El nombre es obligatorio
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" formControlName="email"
            [class.is-invalid]="form.get('email')?.touched && form.get('email')?.invalid">
          <div class="invalid-feedback">
            Ingrese un correo válido
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Asunto</label>
          <input type="text" class="form-control" formControlName="asunto"
            [class.is-invalid]="form.get('asunto')?.touched && form.get('asunto')?.invalid">
          <div class="invalid-feedback">
            El asunto es obligatorio
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Mensaje</label>
          <textarea rows="4" class="form-control" formControlName="mensaje"
            [class.is-invalid]="form.get('mensaje')?.touched && form.get('mensaje')?.invalid"></textarea>
          <div class="invalid-feedback">
            El mensaje es obligatorio
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="enviando">
          {{ enviando ? 'Enviando...' : 'Enviar mensaje' }}
        </button>

      </form>
    </div>
  </div>
</div>
