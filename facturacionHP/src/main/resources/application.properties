spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/Facturacion?useSSL=false&serverTimezone=America/Guayaquil&allowPublicKeyRetrieval=true
